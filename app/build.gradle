 * For more details on building Java & JVM projects, please refer to https://docs.gradle.org/9.6.1/userguide/building_java_projects.html in the Gradle documentation.
 */

plugins {
    id 'application'
}

repositories {
    mavenCentral()
    maven {
        url = 'https://download.oracle.com/maven'
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(26)
    }
}

dependencies {
    // Testing and utility defaults
    testImplementation libs.junit.jupiter
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    implementation libs.guava

    // WEB SCRAPING DEPENDENCIES 
    implementation 'org.jsoup:jsoup:1.18.1'
    implementation 'com.microsoft.playwright:playwright:1.49.0'
    implementation 'org.seleniumhq.selenium:selenium-java:4.27.0'
    implementation 'edu.uci.ics:crawler4j:4.4.0'
    implementation 'com.opencsv:opencsv:5.9'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'
    implementation 'com.google.code.gson:gson:2.11.0'
}

application {
    mainClass = 'org.example.App'
}

tasks.named('test') {
    useJUnitPlatform()
}

// Apply this to every JavaExec task (the default 'run' plus all the
// custom run* tasks below) — each is its own JavaExec and doesn't
// inherit jvmArgs from the others automatically.
tasks.withType(JavaExec).configureEach {
    jvmArgs('--add-exports=java.management/sun.management=ALL-UNNAMED')
}

// Custom tasks pointing to the exact 'org.example.scraping' packages
tasks.register('runJsoup', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'org.example.scraping.JsoupStaticScraper'
}

tasks.register('runPlaywright', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'org.example.scraping.PlaywrightDynamicScraper'
}

tasks.register('runSelenium', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'org.example.scraping.SeleniumDynamicScraper'
}

tasks.register('runCrawler4j', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'org.example.scraping.Crawler4jExample'
}

tasks.register('runThreadSleepLoop', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'org.example.scraping.ThreadSleepLoopExample'
}

tasks.register('runGsonParsing', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'org.example.scraping.GsonParsingExample'
}

tasks.register('runOpenCsvExport', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'org.example.scraping.OpenCsvExportExample'
}

tasks.register('runJacksonExport', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'org.example.scraping.JacksonExportExample'
}